name: trusthire
description: TrustHire - AI Powered Part-Time Job Platform
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.4.3

  # State Management
  flutter_riverpod: ^2.6.1
  # Navigation
  go_router: ^16.0.0

  # Local Storage
  shared_preferences: ^2.5.3

  # File Upload
  image_picker: ^1.2.0
  file_picker: ^10.3.2

  # Payment
  razorpay_flutter: ^1.3.6

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/logo_mark.png