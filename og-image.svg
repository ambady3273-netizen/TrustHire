    <line x1="190" y1="197" x2="260" y2="197" stroke="url(#g1)" stroke-width="16" stroke-linecap="round"/>
    <line x1="260" y1="154" x2="260" y2="240" stroke="url(#g1)" stroke-width="16" stroke-linecap="round"/>
